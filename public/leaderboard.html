<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><title>Leaderboard</title>
<style>
*{box-sizing:border-box}body{margin:0;background:transparent;font-family:system-ui,Segoe UI,Arial,sans-serif;color:#fff}
#w{width:420px;padding:14px;border-radius:18px;background:rgba(10,10,16,.78);backdrop-filter:blur(6px)}
h1{margin:0 0 10px;font-size:18px;letter-spacing:1px;display:flex;align-items:center;gap:8px}
#l{position:relative}
.r{display:flex;align-items:center;gap:10px;height:44px;padding:0 10px;margin-bottom:6px;border-radius:12px;background:#1a1a24;position:absolute;left:0;right:0;transition:top .5s ease,background .4s}
.r.flash{background:#3a2d00}
.n{width:22px;text-align:center;font-weight:900;color:#8b8b9a}
.r:nth-child(1) .n{color:#ffd93b}
.av{width:30px;height:30px;border-radius:50%;background:#333 center/cover;flex:none}
.nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700;font-size:15px}
.p{font-weight:900;color:#ffd93b;font-size:16px}.p small{color:#9a8a50;font-weight:600;font-size:11px;margin-left:3px}
</style></head><body>
<div id="w"><h1>🏆 LEADERBOARD</h1><div id="l"></div></div>
<script>
const q=new URLSearchParams(location.search), N=Math.min(20,+q.get('n')||10), H=50;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const L=document.getElementById('l'), rows=new Map(), prev=new Map();
function render(top){
  top=top.slice(0,N); L.style.height=top.length*H+'px';
  const keep=new Set(top.map(t=>t.id||t.nick));
  rows.forEach((el,k)=>{if(!keep.has(k)){el.remove();rows.delete(k);}});
  top.forEach((t,i)=>{
    const k=t.id||t.nick; let el=rows.get(k);
    if(!el){el=document.createElement('div');el.className='r';el.style.top=(i*H)+'px';
      el.innerHTML='<div class="n"></div><div class="av"></div><div class="nm"></div><div class="p"></div>';L.appendChild(el);rows.set(k,el);}
    el.style.top=(i*H)+'px'; el.querySelector('.n').textContent=i+1;
    if(t.avatar)el.querySelector('.av').style.backgroundImage=`url(${t.avatar})`;
    el.querySelector('.nm').textContent=t.nick;
    el.querySelector('.p').innerHTML=t.points+'<small>poin</small>';
    if(prev.has(k)&&prev.get(k)!==t.points){el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),700);}
    prev.set(k,t.points);
  });
}
(function ws(){const s=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');
  s.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='state')render(m.data.top);};
  s.onclose=()=>setTimeout(ws,2000);})();
</script></body></html>
